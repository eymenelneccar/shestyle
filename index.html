<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>شي ستايل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFF0F5',
              100: '#FFE1EC',
              200: '#F9C0D4',
              300: '#F0A0BF',
              400: '#E07FA8',
              500: '#C96A8A',
              600: '#A8547A',
              700: '#8B3D62',
            }
          }
        }
      }
    }
  </script>
  <style>
    *,
    *::before,
    *::after {
      font-family: 'Tajawal', sans-serif;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(160deg, #FFF0F5 0%, #FDE8F0 40%, #FFF5F8 70%, #FDE0EC 100%);
      min-height: 100vh;
    }

    /* Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Card shadow */
    .card-shadow {
      box-shadow: 0 6px 24px rgba(201, 106, 138, 0.13);
    }

    .btn-shadow {
      box-shadow: 0 8px 32px rgba(201, 106, 138, 0.40);
    }

    /* Category pill active */
    .cat-pill-active {
      background: #C96A8A;
      color: #fff;
    }

    .cat-pill-inactive {
      background: #fff;
      color: #555;
      border: 1.5px solid #F9C0D4;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bumpAnim {

      0%,
      100% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.25)
      }

      70% {
        transform: scale(0.92)
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0
      }

      100% {
        background-position: 400px 0
      }
    }

    .fade-up {
      animation: fadeUp 0.4s ease-out both;
    }

    .bump {
      animation: bumpAnim 0.35s ease;
    }

    .skeleton {
      background: linear-gradient(90deg, #f9e4ec 25%, #fff0f5 50%, #f9e4ec 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
    }

    /* Hero */
    #hero-banner {
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(201, 106, 138, 0.22);
    }

    /* Modal transition */
    .modal-sheet {
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .backdrop-t {
      transition: opacity 0.3s ease;
    }

    /* Side drawer */
    #sideDrawer {
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }

    #sideDrawer.drawer-open {
      transform: translateX(0) !important;
    }

    #drawerBackdrop {
      transition: opacity 0.3s ease;
    }

    .drawer-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: right;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #555;
      transition: background 0.18s, color 0.18s;
    }

    .drawer-nav-btn:hover,
    .drawer-nav-btn.active {
      background: #FFF0F5;
      color: #C96A8A;
    }

    .drawer-nav-btn .material-symbols-outlined {
      font-size: 20px;
    }
  </style>
</head>

<body class="pb-36">

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    'use strict';

    let categories = [];
    let menuItems = [];
    let activeCategory = '';
    let cart = {};
    let whatsappNumber = '905347007284';
    let currencySymbol = 'د.ع';
    let storeName = 'شي ستايل';
    let aboutUsText = '';
    let contactPhone = '';
    let contactWhatsapp = '';
    let contactInstagram = '';
    let contactAddress = '';

    // GitHub config (overridden by /api/config)
    window.GH_OWNER = window.GH_OWNER || '';
    window.GH_REPO = window.GH_REPO || '';
    window.GH_BRANCH = window.GH_BRANCH || 'main';

    const isGhEnabled = () => Boolean(window.GH_OWNER && window.GH_REPO);

    function ghUrls(path) {
      const t = Date.now();
      const p = String(path || '').replace(/^\//, '');
      return [
        `https://raw.githubusercontent.com/${window.GH_OWNER}/${window.GH_REPO}/${window.GH_BRANCH}/${p}?t=${t}`,
        `https://cdn.jsdelivr.net/gh/${window.GH_OWNER}/${window.GH_REPO}@${window.GH_BRANCH}/${p}?t=${t}`
      ];
    }

    async function initDataRepoConfig() {
      if (isGhEnabled()) return;
      try {
        const resp = await fetch('/api/config');
        if (resp.ok) {
          const j = await resp.json();
          if (j && j.ok && j.owner && j.repo) {
            window.GH_OWNER = j.owner;
            window.GH_REPO = j.repo;
            window.GH_BRANCH = j.branch || 'main';
          }
        }
      } catch { }
    }

    function resolveAssetUrl(path) {
      const raw = String(path || '').trim();
      if (!raw) return '';
      if (/^(?:https?:)?\/\//i.test(raw)) return raw;
      const rel = raw.replace(/^\//, '');
      if (!isGhEnabled()) return rel;
      if (!/^assets\//.test(rel)) return raw;
      return `https://raw.githubusercontent.com/${window.GH_OWNER}/${window.GH_REPO}/${window.GH_BRANCH}/${rel}`;
    }

    async function loadJson(path) {
      try {
        if (isGhEnabled()) {
          for (const url of ghUrls(path)) {
            try {
              const r = await fetch(url, { cache: 'no-store' });
              if (r.ok) return await r.json();
            } catch { }
          }
        }
        const t = Date.now();
        const base = String(path || '');
        const url = base + (base.includes('?') ? '&' : '?') + 't=' + t;
        const r = await fetch(url, { cache: 'no-store' });
        return r.ok ? await r.json() : [];
      } catch { return []; }
    }

    function sanitizeCategory(c) {
      if (typeof c === 'string') { const n = c.trim(); return n ? { id: n, name: n } : null; }
      if (c && typeof c === 'object') { const n = (c.name || '').trim(); return n ? { id: n, name: n } : null; }
      return null;
    }

    function sanitizeItem(i, idx) {
      return {
        id: Number(i && i.id) || (idx + 1),
        category: String(i && i.category || '').trim(),
        name: String(i && i.name || '').trim(),
        price: Number(i && i.price) || 0,
        desc: String(i && i.description || i && i.desc || '').trim(),
        image: resolveAssetUrl(String(i && i.imageUrl || '').trim()),
        colors: Array.isArray(i && i.colors) ? i.colors : [],
        variants: Array.isArray(i && i.variants) ? i.variants : []
      };
    }

    // ─── Data init ───────────────────────────────────────────────
    async function loadSettings() {
      // localStorage first (dashboard saves here instantly)
      try {
        const ls_name = localStorage.getItem('store_name');
        const ls_sym = localStorage.getItem('store_currency_symbol');
        const ls_about = localStorage.getItem('store_about');
        const ls_phone = localStorage.getItem('store_contact_phone');
        const ls_wa = localStorage.getItem('store_contact_whatsapp');
        const ls_insta = localStorage.getItem('store_contact_instagram');
        const ls_address = localStorage.getItem('store_contact_address');
        if (ls_name) storeName = ls_name;
        if (ls_sym) currencySymbol = ls_sym;
        if (ls_about) aboutUsText = ls_about;
        if (ls_phone) contactPhone = ls_phone;
        if (ls_wa) contactWhatsapp = ls_wa;
        if (ls_insta) contactInstagram = ls_insta;
        if (ls_address) contactAddress = ls_address;
      } catch { }
      // then try assets/settings.json
      try {
        const s = await loadJson('assets/settings.json');
        if (s && typeof s === 'object') {
          if (s.storeName && !localStorage.getItem('store_name')) storeName = s.storeName;
          if (s.currencySymbol && !localStorage.getItem('store_currency_symbol')) currencySymbol = s.currencySymbol;
          if (s.aboutUs && !localStorage.getItem('store_about')) aboutUsText = s.aboutUs;
          if (s.contactPhone && !localStorage.getItem('store_contact_phone')) contactPhone = s.contactPhone;
          if (s.contactWhatsapp && !localStorage.getItem('store_contact_whatsapp')) contactWhatsapp = s.contactWhatsapp;
          if (s.contactInstagram && !localStorage.getItem('store_contact_instagram')) contactInstagram = s.contactInstagram;
          if (s.contactAddress && !localStorage.getItem('store_contact_address')) contactAddress = s.contactAddress;
        }
      } catch { }
      // apply to UI
      const storeEl = document.getElementById('storeNameEl');
      if (storeEl) storeEl.textContent = storeName;
      const footerEl = document.getElementById('footerStoreName');
      if (footerEl) footerEl.textContent = storeName;
      const drawerNameEl = document.getElementById('drawerStoreName');
      if (drawerNameEl) drawerNameEl.textContent = storeName;
      const aboutNameEl = document.getElementById('aboutStoreName');
      if (aboutNameEl) aboutNameEl.textContent = storeName;
      document.title = storeName;
    }

    async function initData() {
      const [cats, items, branchData] = await Promise.all([
        loadJson('assets/categories.json'),
        loadJson('assets/menu.json'),
        loadJson('assets/branches.json')
      ]);

      // WhatsApp number from branches.json
      if (branchData && typeof branchData === 'object') {
        const first = Object.values(branchData)[0];
        if (first && first.whatsapp) whatsappNumber = first.whatsapp;
      }

      categories = Array.isArray(cats) ? cats.map(sanitizeCategory).filter(Boolean) : [];
      menuItems = Array.isArray(items) ? items.map(sanitizeItem) : [];
      activeCategory = categories[0]?.id || menuItems[0]?.category || '';

      renderCategories();
      renderPopular();
      renderMenu();
    }

    async function loadHero() {
      try {
        const data = await loadJson('assets/hero.json');
        if (!data || typeof data !== 'object') return;
        const imgUrl = String(data.imageUrl || '').trim();
        const videoUrl = String(data.videoUrl || '').trim();
        const type = String(data.mediaType || 'image').toLowerCase();
        const banner = document.getElementById('hero-banner');
        const imgEl = document.getElementById('heroImg');
        const vidEl = document.getElementById('heroVideo');

        if (type === 'video' && videoUrl) {
          vidEl.src = resolveAssetUrl(videoUrl);
          vidEl.classList.remove('hidden');
          banner.classList.remove('hidden');
          try { vidEl.play().catch(() => { }); } catch { }
        } else if (imgUrl) {
          imgEl.src = resolveAssetUrl(imgUrl);
          imgEl.classList.remove('hidden');
          banner.classList.remove('hidden');
        }
      } catch { }
    }

    // ─── Render categories ───────────────────────────────────────
    function renderCategories() {
      const container = document.getElementById('categories-container');
      container.innerHTML = categories.map((cat, i) => `
    <button onclick="setCategory('${cat.id}')"
            class="flex-shrink-0 px-5 py-2 rounded-full text-sm font-bold transition-all duration-200 ${activeCategory === cat.id ? 'cat-pill-active' : 'cat-pill-inactive'
        }" style="animation-delay:${i * 40}ms">
      ${cat.name}
    </button>
  `).join('');
    }

    function setCategory(id) {
      activeCategory = id;
      renderCategories();
      renderMenu();
      const el = document.getElementById('category-section');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ─── Render popular ──────────────────────────────────────────
    function renderPopular() {
      const grid = document.getElementById('popular-grid');
      const pop = menuItems.slice(0, 4);
      grid.innerHTML = pop.length ? pop.map(buildCard).join('') : '';
    }

    // ─── Render menu ─────────────────────────────────────────────
    function renderMenu(items = null, isSearch = false) {
      const grid = document.getElementById('menu-grid');
      const empty = document.getElementById('menu-empty');
      const title = document.getElementById('cat-title');

      const list = items !== null ? items : menuItems.filter(i => i.category === activeCategory);

      if (!isSearch && items === null) {
        const cat = categories.find(c => c.id === activeCategory);
        title.textContent = cat ? cat.name : '';
      } else {
        title.textContent = 'نتائج البحث';
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        empty.style.display = 'flex';
        return;
      }

      empty.classList.add('hidden');
      empty.style.display = '';
      grid.innerHTML = list.map(buildCard).join('');
    }

    // ─── Build product card ──────────────────────────────────────
    const FALLBACK = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect fill='%23FDE8F0' width='200' height='200'/><text fill='%23E07FA8' font-size='40' text-anchor='middle' x='100' y='115' font-family='sans-serif'>☕</text></svg>`;

    function isVideo(url) {
      if (!url) return false;
      return !!String(url).match(/\.(mp4|webm|mov|ogg)$/i) || String(url).startsWith('data:video/');
    }

    function buildCard(item) {
      const mediaUrl = Array.isArray(item.media) && item.media.length > 0 ? item.media[0] : item.image;
      const mediaHtml = isVideo(mediaUrl)
        ? `<video src="${mediaUrl}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`
        : `<img src="${mediaUrl || FALLBACK}" onerror="this.src='${FALLBACK}'" class="w-full h-full object-cover" loading="lazy" alt="${item.name}">`;

      return `
    <div onclick="openImageModal(${item.id})"
         class="bg-white rounded-3xl overflow-hidden cursor-pointer active:scale-95 transition-transform duration-150 card-shadow fade-up">
      <!-- Image -->
      <div class="relative overflow-hidden" style="height:200px; background:#FDE8F0">
        ${mediaHtml}
        <!-- Add to cart overlay -->
        <button onclick="event.stopPropagation(); addToCart(${item.id})"
                class="absolute top-3 left-3 w-9 h-9 bg-white rounded-full flex items-center justify-center shadow-md text-brand-500 active:scale-110 transition-transform"
                style="box-shadow:0 2px 10px rgba(201,106,138,0.2)">
          <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
        </button>
      </div>
      <!-- Info -->
      <div class="p-3">
        <h3 class="font-bold text-gray-800 text-sm mb-1 truncate">${item.name}</h3>
        <p class="text-brand-500 font-black text-[15px]">${item.price.toLocaleString()} <span class="text-xs font-semibold text-brand-400">${currencySymbol}</span></p>
        ${Array.isArray(item.colors) && item.colors.length ? `<div class="flex gap-1 mt-1.5 flex-wrap">${item.colors.map(c => `<span style="background:${c};width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.1)" title="${c}"></span>`).join('')}</div>` : ''}
      </div>
    </div>
  `;
    }

    // ─── Cart logic ──────────────────────────────────────────────
    function addToCartWithOptions(id, color, size, variantPrice) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;
      // key includes color+size so different options are separate cart entries
      const key = `${id}__${color || ''}__${size || ''}`;
      const price = (variantPrice && Number(variantPrice) > 0) ? Number(variantPrice) : item.price;
      if (cart[key]) {
        cart[key].qty++;
      } else {
        cart[key] = { ...item, price, qty: 1, selectedColor: color || null, selectedSize: size || null, cartKey: key };
      }
      updateCartUI();
      const badge = document.getElementById('header-badge');
      badge.classList.add('bump');
      setTimeout(() => badge.classList.remove('bump'), 350);
    }

    function addToCart(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;
      if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1, cartKey: String(id) };
      updateCartUI();

      const badge = document.getElementById('header-badge');
      badge.classList.add('bump');
      setTimeout(() => badge.classList.remove('bump'), 350);
    }

    function removeFromCart(key) {
      if (!cart[key]) return;
      cart[key].qty--;
      if (cart[key].qty <= 0) delete cart[key];
      updateCartUI();
    }

    function incrementCart(key) {
      if (!cart[key]) return;
      cart[key].qty++;
      updateCartUI();
    }

    function updateCartUI() {
      const totalQty = Object.values(cart).reduce((a, b) => a + b.qty, 0);
      const totalPrice = Object.values(cart).reduce((a, b) => a + (b.price * b.qty), 0);

      // Header badge
      const badge = document.getElementById('header-badge');
      if (totalQty > 0) { badge.textContent = totalQty; badge.classList.remove('hidden'); badge.style.display = 'flex'; }
      else { badge.classList.add('hidden'); badge.style.display = ''; }

      // FAB
      const fab = document.getElementById('cart-fab');
      if (totalQty > 0) { fab.classList.remove('hidden'); }
      else { fab.classList.add('hidden'); closeCart(); }

      document.getElementById('cart-count').textContent = totalQty;
      document.getElementById('cart-total').textContent = totalPrice.toLocaleString() + ' ' + currencySymbol;

      renderCartItems(totalPrice);
    }

    function renderCartItems(total) {
      const container = document.getElementById('cart-items');
      if (Object.keys(cart).length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">سلتك فارغة</div>';
        return;
      }

      container.innerHTML = Object.values(cart).map(item => {
        const key = item.cartKey || item.id;
        const colorDot = item.selectedColor ? `<span style="background:${item.selectedColor};width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,0.15);margin-left:3px"></span>` : '';
        const sizeBadge = item.selectedSize ? `<span class="bg-brand-100 text-brand-600 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${item.selectedSize}</span>` : '';
        const mediaHtml = isVideo(item.image)
          ? `<video src="${item.image}" autoplay loop muted playsinline class="w-16 h-16 rounded-xl object-cover flex-shrink-0"></video>`
          : `<img src="${item.image || FALLBACK}" onerror="this.src='${FALLBACK}'" class="w-16 h-16 rounded-xl object-cover flex-shrink-0" alt="${item.name}">`;
        
        return `
    <div class="flex items-center gap-3 bg-brand-50 rounded-2xl p-3">
      ${mediaHtml}
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-gray-800 text-sm truncate">${item.name}</h4>
        <div class="flex items-center gap-1 mt-0.5">${colorDot}${sizeBadge}</div>
        <p class="text-brand-500 font-black text-sm mt-0.5">${(item.price * item.qty).toLocaleString()} ${currencySymbol}</p>
      </div>
      <div class="flex flex-col items-center gap-0.5 bg-white rounded-2xl py-1.5 px-1 w-9 shadow-sm border border-brand-100">
        <button onclick="incrementCart('${key}')" class="w-7 h-7 flex items-center justify-center text-brand-500 font-black text-lg leading-none">+</button>
        <span class="text-sm font-black text-gray-800">${item.qty}</span>
        <button onclick="removeFromCart('${key}')" class="w-7 h-7 flex items-center justify-center text-gray-400 hover:text-red-400 font-black text-xl leading-none">−</button>
      </div>
    </div>
  `}).join('');

      document.getElementById('modal-subtotal').textContent = total.toLocaleString() + ' ' + currencySymbol;
      document.getElementById('modal-total').textContent = total.toLocaleString() + ' ' + currencySymbol;
    }

    // ─── Open / close cart ───────────────────────────────────────
    function openCart() {
      const modal = document.getElementById('cart-modal');
      const panel = document.getElementById('cart-panel');
      const backdrop = document.getElementById('cart-backdrop');

      // Restore saved form values
      try {
        const map = { custName: 'order_name', custPhone: 'order_phone', custAddress: 'order_address', custNote: 'order_note' };
        for (const [id, key] of Object.entries(map)) {
          const el = document.getElementById(id);
          if (el) el.value = localStorage.getItem(key) || '';
        }
      } catch { }

      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.style.opacity = '1';
        panel.style.transform = 'translateY(0)';
      });
    }

    function closeCart() {
      const modal = document.getElementById('cart-modal');
      const panel = document.getElementById('cart-panel');
      const backdrop = document.getElementById('cart-backdrop');

      panel.style.transform = 'translateY(100%)';
      backdrop.style.opacity = '0';
      setTimeout(() => modal.classList.add('hidden'), 320);
    }

    // ─── Product detail modal ────────────────────────────────────
    let _modalSelectedColor = null;
    let _modalSelectedSize = null;
    let _modalSelectedVariantPrice = null;

    function openImageModal(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;
      const modal = document.getElementById('image-modal');
      const content = document.getElementById('image-modal-content');

      _modalSelectedColor = null;
      _modalSelectedSize = null;
      _modalSelectedVariantPrice = null;

      const carousel = document.getElementById('modal-carousel');
      const dotsContainer = document.getElementById('modal-carousel-dots');
      carousel.innerHTML = '';
      dotsContainer.innerHTML = '';

      const mediaUrls = Array.isArray(item.media) && item.media.length > 0 ? item.media : (item.image ? [item.image] : []);
      if (mediaUrls.length === 0) mediaUrls.push(FALLBACK);

      mediaUrls.forEach((url, idx) => {
        const slide = document.createElement('div');
        slide.className = 'flex-shrink-0 snap-center flex justify-center items-center';
        slide.style.width = '100%';
        slide.style.minWidth = '100%';
        if (isVideo(url)) {
          slide.innerHTML = `<video src="${url}" autoplay loop muted playsinline class="w-full object-contain" style="max-height: 65vh;"></video>`;
        } else {
          slide.innerHTML = `<img src="${url}" alt="" class="w-full object-contain" style="max-height: 65vh;" onerror="this.src='${FALLBACK}'">`;
        }
        carousel.appendChild(slide);

        if (mediaUrls.length > 1) {
          const dot = document.createElement('div');
          dot.className = `w-2 h-2 rounded-full transition-all ${idx === 0 ? 'bg-white scale-125' : 'bg-white/50'}`;
          dotsContainer.appendChild(dot);
        }
      });

      if (mediaUrls.length > 1) {
        carousel.onscroll = () => {
          const index = Math.round(carousel.scrollLeft / carousel.clientWidth);
          Array.from(dotsContainer.children).forEach((dot, i) => {
            dot.className = `w-2 h-2 rounded-full transition-all ${i === index ? 'bg-white scale-125' : 'bg-white/50'}`;
          });
        };
      } else {
        carousel.onscroll = null;
      }

      document.getElementById('modal-title').textContent = item.name;
      document.getElementById('modal-desc').textContent = item.desc || '';
      document.getElementById('modal-price').textContent = item.price.toLocaleString() + ' ' + currencySymbol;

      // ── Colors ──
      const colorsSection = document.getElementById('modal-colors-section');
      const colorsRow = document.getElementById('modal-colors-row');
      const colors = Array.isArray(item.colors) ? item.colors.filter(Boolean) : [];
      if (colors.length) {
        colorsRow.innerHTML = colors.map((c, i) => `
      <button type="button" onclick="_selectColor(this,'${c}')"
              class="color-dot w-8 h-8 rounded-full border-2 border-transparent transition-all active:scale-90"
              style="background:${c}" data-color="${c}" title="${c}"></button>
    `).join('');
        colorsSection.classList.remove('hidden');
        // auto-select first
        const firstDot = colorsRow.querySelector('.color-dot');
        if (firstDot) _selectColor(firstDot, colors[0]);
      } else {
        colorsSection.classList.add('hidden');
        colorsRow.innerHTML = '';
      }

      // ── Sizes / Variants ──
      const sizesSection = document.getElementById('modal-sizes-section');
      const sizesRow = document.getElementById('modal-sizes-row');
      const variants = Array.isArray(item.variants) ? item.variants.filter(v => v && v.label) : [];
      if (variants.length) {
        sizesRow.innerHTML = variants.map((v, i) => `
      <button type="button" onclick="_selectSize(this,'${v.label}',${v.price || item.price})"
              class="size-btn px-4 py-2 rounded-2xl text-sm font-bold border transition-all active:scale-95 ${i === 0 ? 'bg-brand-500 text-white border-brand-500' : 'bg-white text-gray-700 border-gray-200'}"
              data-size="${v.label}" data-price="${v.price || item.price}">
        ${v.label}
      </button>
    `).join('');
        sizesSection.classList.remove('hidden');
        // auto-select first
        const firstBtn = sizesRow.querySelector('.size-btn');
        if (firstBtn) _selectSize(firstBtn, variants[0].label, variants[0].price || item.price);
      } else {
        sizesSection.classList.add('hidden');
        sizesRow.innerHTML = '';
      }

      document.getElementById('modal-add-btn').onclick = () => {
        addToCartWithOptions(id, _modalSelectedColor, _modalSelectedSize, _modalSelectedVariantPrice);
        closeImageModal();
      };

      modal.classList.remove('hidden');
      requestAnimationFrame(() => { content.style.transform = 'translateY(0)'; });
    }

    function _selectColor(btn, color) {
      _modalSelectedColor = color;
      document.querySelectorAll('#modal-colors-row .color-dot').forEach(b => {
        b.style.borderColor = 'transparent';
        b.style.boxShadow = '';
      });
      btn.style.borderColor = '#C96A8A';
      btn.style.boxShadow = '0 0 0 2px white, 0 0 0 4px #C96A8A';
    }

    function _selectSize(btn, size, price) {
      _modalSelectedSize = size;
      _modalSelectedVariantPrice = price;
      // update price display
      const priceEl = document.getElementById('modal-price');
      if (priceEl) priceEl.textContent = Number(price).toLocaleString() + ' ' + currencySymbol;
      // update button styles
      document.querySelectorAll('#modal-sizes-row .size-btn').forEach(b => {
        b.classList.remove('bg-brand-500', 'text-white', 'border-brand-500');
        b.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
      });
      btn.classList.add('bg-brand-500', 'text-white', 'border-brand-500');
      btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      const content = document.getElementById('image-modal-content');
      const carousel = document.getElementById('modal-carousel');
      if (carousel) {
        carousel.querySelectorAll('video').forEach(vid => vid.pause());
      }
      content.style.transform = 'translateY(100%)';
      setTimeout(() => modal.classList.add('hidden'), 320);
    }

    // ─── Search ───────────────────────────────────────────────────
    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      const input = document.getElementById('searchInput');
      const isHidden = bar.classList.contains('hidden');
      bar.classList.toggle('hidden');
      if (isHidden) { input.focus(); }
      else { input.value = ''; renderMenu(); }
    }

    // ─── Checkout ────────────────────────────────────────────────
    function checkout() {
      const totalSum = Object.values(cart).reduce((a, b) => a + (b.price * b.qty), 0);
      const lines = Object.values(cart).map(i => {
        const variants = [i.selectedColor ? `لون: ${i.selectedColor}` : '', i.selectedSize ? `مقاس: ${i.selectedSize}` : ''].filter(Boolean).join(' | ');
        return ` - ${i.name}${variants ? ` (${variants})` : ''} x ${i.qty} — ${(i.price * i.qty).toLocaleString('ar-IQ')} ${currencySymbol}`;
      }).join('\n');
      const name = (document.getElementById('custName')?.value || '').trim();
      const phone = (document.getElementById('custPhone')?.value || '').trim();
      const address = (document.getElementById('custAddress')?.value || '').trim();
      const note = (document.getElementById('custNote')?.value || '').trim();

      try {
        localStorage.setItem('order_name', name);
        localStorage.setItem('order_phone', phone);
        localStorage.setItem('order_address', address);
        localStorage.setItem('order_note', note);
      } catch { }

      const invoice = [
        'فاتورة الطلب',
        'الأصناف:', lines,
        `المجموع: ${totalSum.toLocaleString('ar-IQ')} ${currencySymbol}`,
        `الاسم: ${name || '-'}`,
        `الرقم: ${phone || '-'}`,
        `العنوان: ${address || '-'}`,
        `ملاحظة: ${note || '-'}`
      ].join('\n');

      window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(invoice)}`, '_blank');
    }

    // ─── Logo from localStorage ───────────────────────────────────
    function applyHeaderLogo() {
      try {
        const url = localStorage.getItem('restaurant_logo_url') || '';
        if (url) { const el = document.getElementById('headerLogo'); if (el) el.src = resolveAssetUrl(url); }
      } catch { }
    }

    // ─── Search input listener ────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').addEventListener('input', e => {
        const term = e.target.value.toLowerCase().trim();
        if (!term) { renderMenu(); return; }
        const filtered = menuItems.filter(i =>
          i.name.toLowerCase().includes(term) ||
          i.desc.toLowerCase().includes(term)
        );
        renderMenu(filtered, true);
      });
    });

    // ─── Side Drawer ─────────────────────────────────────────────
    function openDrawer() {
      const backdrop = document.getElementById('drawerBackdrop');
      const drawer = document.getElementById('sideDrawer');
      drawerShowPage('nav');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.style.opacity = '1';
        drawer.style.transform = 'translateX(0)';
      });
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      const backdrop = document.getElementById('drawerBackdrop');
      const drawer = document.getElementById('sideDrawer');
      backdrop.style.opacity = '0';
      drawer.style.transform = 'translateX(100%)';
      setTimeout(() => backdrop.classList.add('hidden'), 300);
      document.body.style.overflow = '';
    }

    function drawerShowPage(page) {
      const nav = document.getElementById('drawerNav');
      const about = document.getElementById('drawerAbout');
      const contact = document.getElementById('drawerContact');
      [nav, about, contact].forEach(el => { el.classList.add('hidden'); el.classList.remove('flex'); });

      if (page === 'nav') {
        nav.classList.remove('hidden');
      } else if (page === 'about') {
        about.classList.remove('hidden'); about.classList.add('flex');
        const el = document.getElementById('aboutUsText');
        if (el) el.textContent = aboutUsText || 'لا توجد معلومات بعد.';
      } else if (page === 'contact') {
        contact.classList.remove('hidden'); contact.classList.add('flex');
        _renderContactContent();
      }
    }

    function _renderContactContent() {
      const el = document.getElementById('contactContent');
      if (!el) return;
      const items = [
        contactPhone ? { icon: 'phone', label: 'الهاتف', val: contactPhone, href: `tel:${contactPhone}` } : null,
        contactWhatsapp ? { icon: 'chat', label: 'واتساب', val: contactWhatsapp, href: `https://wa.me/${contactWhatsapp.replace(/\D/g, '')}` } : null,
        contactInstagram ? { icon: 'photo_camera', label: 'إنستغرام', val: contactInstagram, href: `https://instagram.com/${contactInstagram.replace('@', '')}` } : null,
        contactAddress ? { icon: 'location_on', label: 'العنوان', val: contactAddress, href: null } : null,
      ].filter(Boolean);

      if (!items.length) { el.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">لا توجد بيانات تواصل بعد.</p>'; return; }
      el.innerHTML = items.map(it => `
    <a ${it.href ? `href="${it.href}" target="_blank"` : ''} class="flex items-center gap-3 bg-brand-50 rounded-2xl p-3 ${it.href ? 'cursor-pointer' : ''}">
      <div class="w-9 h-9 bg-brand-100 rounded-xl flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-brand-500 text-[18px]">${it.icon}</span>
      </div>
      <div>
        <div class="text-[11px] text-gray-400 font-medium">${it.label}</div>
        <div class="text-sm font-bold text-gray-700 leading-tight">${it.val}</div>
      </div>
    </a>`).join('');
    }

    // ─── Bootstrap ───────────────────────────────────────────────
    (async () => {
      await initDataRepoConfig();
      await Promise.all([initData(), loadHero(), loadSettings()]);
      applyHeaderLogo();
    })();
  </script>
</body>

</html>
